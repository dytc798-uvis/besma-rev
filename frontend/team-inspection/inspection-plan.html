<!doctype html>


<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>점검계획 · BESMA</title><link rel="stylesheet" href="/inspection-plan.css?v=20261031.11"><link rel="stylesheet" href="/inspection-report-editor.css?v=20261030.1"><link rel="stylesheet" href="/half-year-editor.css?v=20261031.11"></head>


<body><main>


<header><div><a href="/">‹ BESMA</a><h1>안전보건 점검계획</h1><p id="identity">로그인을 확인하고 있습니다.</p></div><span id="version">2026.10.31.11</span></header>


<p id="notice" role="status"></p>


<section id="workspace" hidden>


<div class="toolbar"><label>조회 월 <input id="month" type="month" value="2026-11"></label><label>범위 <select id="scope"><option value="mine">내 점검계획</option><option value="all">전체 점검계획</option></select></label><label>현장 검색 <input id="search" type="search" placeholder="현장명·담당자"></label><button id="refresh">새로고침</button></div>


<p id="summary"></p><p id="read-only" hidden>이 기기에서는 조회만 가능합니다. 일정 수정은 PC에서 해 주세요.</p>


<div class="table-wrap"><table><thead><tr><th>예정일</th><th>담당자</th><th>현장</th><th>상태</th><th>일정·출장</th></tr></thead><tbody id="rows"></tbody></table></div>


<p id="empty" hidden>조회된 점검계획이 없습니다.</p>


</section>


<section id="half-year-review-panel" hidden></section>


<section id="inspection-report-panel" hidden></section>


<dialog id="editor"><form id="edit-form"><h2>점검계획 수정</h2><p id="edit-owner"></p><label>현장명 <input id="title" maxlength="300" required></label><div class="pair"><label>예정일 <input id="start" type="date" required></label><label>종료일 <input id="end" type="date"></label></div><label>상태 <select id="status"><option value="PLANNED">예정</option><option value="IN_PROGRESS">진행</option><option value="ON_HOLD">보류</option><option value="COMPLETED">완료</option></select></label><label>협의 내용·현장 정보 <textarea id="detail" rows="9" maxlength="20000"></textarea></label><p id="edit-notice" role="alert"></p><div class="actions"><button type="button" id="edit-close" class="secondary">닫기</button><button id="save" type="submit">저장</button></div></form></dialog>


<dialog id="trip"><div><h2>출장신청서 내용</h2><div class="pair"><label>출장 시작일 <input id="trip-start" type="date"></label><label>출장 종료일 <input id="trip-end" type="date"></label></div><button id="trip-load">점검계획 불러오기</button><p>교통수단·출발 및 도착 시각·예상경비를 작성한 뒤 출장신청서에 옮겨 주세요.</p><textarea id="trip-text" rows="15" readonly aria-label="출장신청 내용"></textarea><p id="trip-notice" role="status"></p><div class="actions"><button id="trip-close" class="secondary">닫기</button><button id="trip-copy" disabled>내용 복사</button></div></div></dialog>


<script type="module" src="/inspection-plan.js?v=20261031.11"></script></main></body></html>
