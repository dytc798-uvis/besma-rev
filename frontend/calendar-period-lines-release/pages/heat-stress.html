<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>체감온도 기록 · BESMA</title><link rel="stylesheet" href="/assets/heat-stress-f916f3483296.css"><script type="module" src="/assets/heat-stress-2192f880cb6b.js"></script><link rel="stylesheet" href="/assets/global-auth-nav-bfb555f40b84.css"><script type="module" src="/assets/global-auth-nav-725d677ddf36.js"></script></head><body><header class="heat-header"><a href="/">BESMA</a><span>체감온도 기록</span><a href="/workspace.html">업무공간</a></header><main><p id="heat-status" role="status">로그인을 확인하고 있습니다.</p><section aria-labelledby="weather-title"><div class="section-title"><h1 id="weather-title">기온·체감온도·습도</h1><div><button id="weather-refresh" type="button">새로고침</button><button id="weather-gps" type="button">내 위치 날씨</button></div></div><p id="weather-location"></p><div class="weather-cards"><article><span>현재 기온</span><strong id="weather-temperature">—</strong></article><article><span>기상 체감온도</span><strong id="weather-apparent">—</strong></article><article><span>습도</span><strong id="weather-humidity">—</strong></article></div><p id="weather-source" class="muted"></p></section><section id="record-section" hidden><h2>체감온도 기록하기</h2><form id="heat-form"><div class="form-grid"><label>측정일시<input id="measured-at" type="datetime-local" required></label><label>작업장소<input id="work-location" maxlength="200" required placeholder="예: 지하 1층 전기실"></label><label>작업내용<input id="work-process" maxlength="200"></label><label>측정기준<select id="measurement-source"><option value="ON_SITE">현장 측정값</option><option value="WEATHER_REFERENCE">기상자료 참고값</option></select></label><label>기온 (℃)<input id="air-temperature" type="number" min="-20" max="60" step="0.1" required></label><label>습도 (%)<input id="relative-humidity" type="number" min="0" max="100" step="0.1" required></label></div><button id="copy-weather" type="button">기상자료 참고값 가져오기</button><div id="record-policy" class="record-policy" aria-live="polite"><p>기온과 습도를 입력하세요.</p></div><p class="muted">기록 체감온도는 기존 기온·습도 기준으로 계산합니다. 기상 체감온도와 차이가 있을 수 있습니다.</p><fieldset><legend>실제 실시한 조치</legend><div id="action-options" class="action-options"></div></fieldset><label>조치내용<textarea id="action-notes" maxlength="2000" rows="2"></textarea></label><div class="signature-heading"><label for="recorder-signature">기록자 서명 <span id="recorder-name"></span></label><button id="clear-recorder" type="button">서명 지우기</button></div><canvas id="recorder-signature" width="680" height="160" tabindex="0" aria-label="기록자 서명란"></canvas><button id="save-record" class="primary" type="submit">서명하고 기록 저장</button></form></section><section aria-labelledby="records-title"><div class="section-title"><h2 id="records-title">체감온도 기록</h2><button id="records-refresh" type="button">기록 새로고침</button></div><p id="record-scope" class="muted"></p><form id="records-filter" class="filters"><label>시작일<input id="date-from" type="date"></label><label>종료일<input id="date-to" type="date"></label><button type="submit">조회</button><button id="ledger-pdf" type="button">관리대장 PDF</button></form><div id="heat-records"></div></section></main><dialog id="confirm-dialog"><form id="confirm-form"><div class="section-title"><h2>확인 서명</h2><button id="close-confirm" type="button">닫기</button></div><p id="confirm-record-label"></p><label>확인자<input id="confirmer-name" maxlength="100" required></label><label>직책<input id="confirmer-title" maxlength="100" required></label><div class="signature-heading"><span>확인자 서명</span><button id="clear-confirmer" type="button">서명 지우기</button></div><canvas id="confirmer-signature" width="680" height="160" tabindex="0" aria-label="확인자 서명란"></canvas><button id="confirm-record" class="primary" type="submit">확인 서명 저장</button></form></dialog></body></html>
