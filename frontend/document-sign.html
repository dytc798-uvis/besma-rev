<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>문서 서명 · BESMA</title><link rel="stylesheet" href="/assets/document-sign.css"><script type="module" src="/assets/document-sign.js"></script></head><body><header class="top"><a href="/company.html"><img src="/workspace-assets/boohyun-symbol.svg" alt="부현전기">BESMA</a><a id="workspace-back" href="/workspace.html">업무공간</a></header><main><p class="eyebrow" id="menu-number">11</p><h1>문서 서명</h1><p id="notice" role="status" aria-live="polite">불러오고 있습니다.</p><section id="admin" hidden><form id="upload"><label>서명받을 PDF<input id="pdf-file" type="file" accept="application/pdf,.pdf" required></label><label>서명받을 사람<input id="signer" maxlength="80" required placeholder="이름 또는 직책"></label><button id="upload-button">문서 열기</button></form><p>PDF 12MB·30쪽 이하 · 링크는 7일간 유효합니다.</p><section id="editor" hidden><h2 id="filename"></h2><div class="toolbar"><button id="prev" type="button">이전 쪽</button><span id="page-label"></span><button id="next" type="button">다음 쪽</button></div><p>서명을 넣을 위치를 드래그해 주세요.</p><div id="page-wrap"><img id="preview" alt="서명 위치를 선택할 문서"><div id="selection" hidden></div></div><p id="selection-info">서명 위치를 선택해 주세요.</p><button id="make-link" disabled>이 위치로 링크 만들기</button><div id="link-result" hidden><input id="share-link" readonly aria-label="서명 링크"><button id="copy-link">링크 복사</button><a id="open-link" target="_blank" rel="noopener noreferrer">서명 화면 확인</a><p>링크를 받은 사람은 문서를 보고 서명할 수 있습니다.</p></div></section><h2>내가 요청한 문서</h2><button id="refresh">새로고침</button><div id="requests"></div></section><section id="recipient" hidden><h2 id="recipient-title"></h2><p id="recipient-name"></p><div id="document-pages"></div><button id="start-sign" disabled>서명하기</button><button id="public-download" hidden>서명된 PDF 받기</button></section></main><section id="pad" hidden aria-label="전체 화면 서명"><header><strong>아래에 서명해 주세요.</strong><button id="pad-close">문서 보기</button></header><div class="canvas-area"><canvas id="signature" width="1200" height="700" aria-label="손가락이나 마우스로 서명"></canvas></div><footer><button id="erase">지우기</button><span id="pad-notice" role="status"></span><button id="submit-sign">서명 완료</button></footer></section></body></html>
